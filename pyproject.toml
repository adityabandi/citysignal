[project]
name = "citysignal"
version = "0.1.0"
description = "Near-zero-maintenance monitor of housing, jobs, tourism and stress across Spanish cities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
citysignal = "citysignal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines/citysignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipelines"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
