  news_housing_volume:
    label: Housing-themed coverage volume
    plain: How much of the city's coverage is about housing, rents and evictions.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: gdelt
    section: attention
    direction: -1
    lag: leading
    range: [0, 100]

  vehicle_registrations:
    label: New vehicle registrations
    plain: How many vehicles were newly registered — a fast, keyless read on household and business confidence.
    label_es: Matriculaciones de vehículos
    unit: vehicles
    cadence: monthly
    geo_level: province
    source_id: dgt
    section: work
    direction: 1
    lag: leading
    range: [0, 200000]
    note: >
      Not "new cars sold". Counts DGT transaction code 1 ("Matriculación
      ordinaria y de ciclomotores") only — genuine new registrations, never
      transfers of ownership, temporary plates, re-registrations or
      de-registrations, which are separate transaction codes and excluded.
      But that transaction code spans nearly every vehicle class, not cars
      alone: in a sampled month, passenger cars were about 69% of qualifying
      rows, motorcycles and mopeds about 14%, vans about 9%, and the
      remainder trucks, buses, trailers, agricultural machinery and a
      handful of historic and special vehicles. The province is where the
      registration was filed (DGT's own COD_PROVINCIA_MAT), not the vehicle
      owner's home province (COD_PROVINCIA_MAT and COD_PROVINCIA_VEH are
      different fields in the source file) — Madrid runs 3-4x above
      Barcelona because national fleet, leasing and rental-car operators
      file their registrations there administratively regardless of where
      the vehicle will actually operate. That is a real, widely-reported
      feature of Spanish registration statistics, not a data error: this
      adapter's province-level annual totals were cross-checked against
      DGT's own published "Matriculación por provincias" table and matched
      to within the one month DGT itself never published.
  job_postings_index:
    label: Job postings index
    plain: Index level of total job postings on Indeed for Spain (100 = February 2020), seasonally adjusted and 7-day lagged. A forward-looking indicator of hiring intent.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: indeed
    section: work
    direction: 1
    lag: leading
    range: [0, 200]
    note: >
      Indeed publishes daily observations for both 'total postings' and 'new postings';
      we use 'total postings'. The index is seasonally adjusted. February 2020 baseline = 100.
      Recent months are withheld until Indeed's data is complete (before the month ends).

