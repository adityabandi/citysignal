# Metric registry. Every canonical record must name a metric_id defined here, and
# its unit and cadence must match. `direction` is +1 when a rising value means a
# hotter/stronger market and -1 when rising means weaker or more distressed —
# the derive engine uses it to orient z-scores before combining them.
# `lag` records whether the measure leads, coincides with, or lags the cycle;
# the lead-lag lab can demote a "leading" claim that stops holding.

metrics:
  # ---------------------------------------------------------------- population
  population_padron:
    label: Population (padrón)
    plain: How many people are officially registered as living in the city.
    label_es: Población (padrón)
    unit: persons
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: lagging
    range: [1000, 4000000]
  population_foreign_share:
    label: Foreign-national share
    plain: What share of registered residents hold a foreign nationality.
    unit: percent
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: lagging
    range: [0, 80]
  net_migration:
    label: Net migration
    plain: People moving in minus people moving out.
    unit: persons
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: coincident
    range: [-200000, 200000]
  births:
    label: Births
    plain: How many babies were born to mothers living here. Housing demand two decades ahead, and household formation now.
    unit: births
    cadence: monthly
    geo_level: province
    source_id: ine
    section: people
    direction: 1
    lag: leading
    range: [0, 20000]
  marriages:
    label: Marriages
    plain: How many couples were married. Signals household formation and demand for homes together.
    unit: marriages
    cadence: monthly
    geo_level: province
    source_id: ine
    section: people
    direction: 1
    lag: leading
    range: [0, 10000]

  # ------------------------------------------------------------------- housing
  rent_reference:
    label: Reference rent
    plain: What a square metre of rented housing costs per month, from the government's rent index.
    label_es: Precio de referencia del alquiler
    unit: eur_m2_month
    cadence: annual
    geo_level: municipality
    source_id: mivau
    section: housing
    direction: 1
    lag: coincident
    range: [1, 60]
  dwelling_stock:
    label: Dwelling stock
    plain: How many homes exist in total.
    unit: dwellings
    cadence: annual
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: lagging
    range: [500, 4000000]
    note: >
      Published by province only — there is no municipal breakdown in the
      ministry's estimate. Madrid province holds about 3.05 million dwellings
      against roughly 1.5 million in the municipality, so this is provincial
      context rather than a count of homes in the city. Per-dwelling ratios built
      on it inherit that scope and are labelled accordingly.
  housing_transactions:
    label: Housing transactions
    plain: How many homes changed hands.
    unit: transactions
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: housing
    direction: 1
    lag: leading
    range: [0, 60000]
    note: >
      Not currently collected. The ministry's transactions file only carries
      counts for one subsidised-housing category, which would misrepresent total
      market volume if published as "housing transactions". INE's registered
      property transfers cover the same ground honestly and are used instead.
      The metric stays declared so the gap is visible rather than forgotten.
  appraised_value:
    label: Appraised housing value
    plain: What valuers say a square metre of housing is worth — the number banks lend against.
    unit: eur_m2
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: housing
    direction: 1
    lag: lagging
    range: [200, 8000]
  land_price:
    label: Urban land price
    plain: What building land costs per square metre. It moves before construction does.
    unit: eur_m2
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: leading
    range: [10, 5000]
  housing_starts:
    label: Housing starts
    plain: How many homes builders began. The earliest signal that supply is coming.
    unit: dwellings
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: leading
    range: [0, 60000]
  housing_completions:
    label: Housing completions
    plain: How many homes were finished and can actually be lived in.
    unit: dwellings
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: lagging
    range: [0, 60000]
  rent_district_m2:
    label: District rental price per square metre
    plain: What a square metre of rented housing costs per month, by district.
    unit: eur_m2_month
    cadence: annual
    geo_level: district
    source_id: serpavi
    section: housing
    direction: 1
    lag: coincident
    range: [1, 60]
  rent_district_total:
    label: District total monthly rent
    plain: The average total monthly rent for a full dwelling, by district.
    unit: eur
    cadence: annual
    geo_level: district
    source_id: serpavi
    section: housing
    direction: 1
    lag: coincident
    range: [100, 6000]
  rent_district_dwellings:
    label: Rented dwellings observed
    plain: How many rented dwellings were surveyed to build the district average rent.
    unit: dwellings
    cadence: annual
    geo_level: district
    source_id: serpavi
    section: housing
    direction: 1
    lag: coincident
    range: [0, 200000]
  house_price_index:
    label: House price index
    plain: The official measure of how house prices are moving, set to 100 in a base year.
    unit: index
    cadence: quarterly
    geo_level: ccaa
    source_id: ine
    section: housing
    direction: 1
    lag: lagging
    range: [30, 400]
  property_transfers:
    label: Property transfers (registered)
    plain: How many properties were legally transferred, from the land registry. Faster than the price statistics.
    unit: transactions
    cadence: monthly
    geo_level: province
    source_id: ine
    section: housing
    direction: 1
    lag: leading
    range: [0, 40000]
  mortgages_count:
    label: New mortgages on dwellings
    plain: How many new mortgages were signed on homes.
    unit: mortgages
    cadence: monthly
    geo_level: province
    source_id: ine
    section: credit
    direction: 1
    lag: leading
    range: [0, 30000]
  mortgage_amount_avg:
    label: Average mortgage amount
    plain: The average size of a new mortgage.
    unit: eur
    cadence: monthly
    geo_level: province
    source_id: ine
    section: credit
    direction: 1
    lag: coincident
    range: [20000, 700000]
  visados_new_build:
    label: Building permit visas (new construction buildings)
    plain: How many buildings received construction permits for new housing — the earliest signal of supply arriving.
    unit: buildings
    cadence: monthly
    geo_level: ccaa
    source_id: visados
    section: supply
    direction: 1
    lag: leading
    range: [0, 2000]
  visados_area:
    label: Building permits, construction area
    plain: The total area of new construction receiving permits, measured in square metres.
    unit: m2
    cadence: monthly
    geo_level: ccaa
    source_id: visados
    section: supply
    direction: 1
    lag: leading
    range: [0, 5000000]
  visados_budget:
    label: Building permits, execution budget
    plain: The estimated total budget for execution of newly permitted construction projects.
    unit: eur
    cadence: monthly
    geo_level: ccaa
    source_id: visados
    section: supply
    direction: 1
    lag: leading
    range: [0, 3000000000]
  notary_sales:
    label: Housing sales (notary records)
    plain: How many housing sales were signed before a notary — leading the land registry by about 2 months.
    unit: transactions
    cadence: monthly
    geo_level: province
    source_id: notariado
    section: housing
    direction: 1
    lag: leading
    range: [0, 40000]
  notary_price_m2:
    label: Housing price per square metre (notary records)
    plain: The price per square metre of housing sold, from notary records.
    unit: eur_m2
    cadence: monthly
    geo_level: province
    source_id: notariado
    section: housing
    direction: 1
    lag: leading
    range: [200, 8000]

  # -------------------------------------------------------------------- labour
  unemployment_registered:
    label: Registered unemployment
    plain: How many people are signed on as unemployed at the job office.
    label_es: Paro registrado
    unit: persons
    cadence: monthly
    geo_level: municipality
    source_id: sepe
    section: work
    direction: -1
    lag: coincident
    range: [0, 600000]
  contracts_registered:
    label: New contracts registered
    plain: How many new employment contracts were registered. Hiring shows up here first.
    unit: contracts
    cadence: monthly
    geo_level: municipality
    source_id: sepe
    section: work
    direction: 1
    lag: leading
    range: [0, 400000]
  affiliations:
    label: Social Security affiliations
    plain: How many people are paying into social security — the closest thing to a live headcount of who is working.
    unit: persons
    cadence: monthly
    geo_level: province
    source_id: segsocial
    section: work
    direction: 1
    lag: coincident
    range: [1000, 4000000]

  # ------------------------------------------------------------------- tourism
  hotel_travellers:
    label: Hotel travellers
    plain: How many guests checked into hotels.
    unit: persons
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 2000000]
  hotel_nights:
    label: Hotel overnight stays
    plain: How many nights guests actually stayed. Catches longer trips that guest counts miss.
    unit: nights
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 6000000]
  hotel_international_share:
    label: International share of hotel nights
    plain: What share of hotel nights are booked by visitors from outside Spain.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 100]
  hotel_occupancy_rate:
    label: Hotel occupancy rate
    plain: What share of hotel rooms were filled.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 100]
  hotel_adr:
    label: Average daily rate
    plain: The average price paid for a hotel room per night.
    unit: eur
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range: [10, 600]
  hotel_revpar:
    label: Revenue per available room
    plain: Room revenue per available room — price and occupancy combined, so it falls if either does.
    unit: eur
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 500]
  airport_passengers:
    label: Airport passengers
    plain: How many passengers passed through the city's airport.
    unit: passengers
    cadence: monthly
    geo_level: airport
    source_id: aena
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 8000000]
  airport_flights:
    label: Airport flights (daily traffic)
    plain: How many flights the airport handled. Counted daily, so it arrives weeks before passenger figures.
    unit: flights
    cadence: monthly
    geo_level: airport
    source_id: eurocontrol
    section: tourism
    direction: 1
    lag: leading
    range: [0, 60000]
  port_passengers:
    label: Port passengers
    plain: How many passengers came through the port, including cruise arrivals.
    unit: passengers
    cadence: monthly
    geo_level: port
    source_id: puertos
    section: tourism
    direction: 1
    lag: coincident
    range: [0, 1500000]

  # ----------------------------------------------------------- short-term rent
  tourist_dwellings:
    label: Tourist dwellings (official)
    plain: How many homes are officially registered as tourist lets.
    unit: dwellings
    cadence: quarterly
    geo_level: municipality
    source_id: ine
    section: str
    direction: 1
    lag: coincident
    range: [0, 100000]
  tourist_dwelling_places:
    label: Tourist dwelling bed places
    plain: How many beds those registered tourist lets offer.
    unit: places
    cadence: quarterly
    geo_level: municipality
    source_id: ine
    section: str
    direction: 1
    lag: coincident
    range: [0, 500000]
  str_listings:
    label: Airbnb listings (research)
    plain: How many Airbnb listings are visible in the city. A scraped snapshot, not an official register.
    unit: listings
    cadence: monthly
    geo_level: municipality
    source_id: insideairbnb
    section: str
    direction: 1
    lag: leading
    range: [0, 100000]
  str_entire_home_share:
    label: Entire-home share of listings
    plain: What share of Airbnb listings are whole homes rather than a spare room — whole homes are the ones taken off the long-term market.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: insideairbnb
    section: str
    direction: 1
    lag: leading
    range: [0, 100]
  str_multi_host_share:
    label: Multi-listing host share
    plain: What share of listings belong to hosts running several. High means professional operators, not people letting a spare room.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: insideairbnb
    section: str
    direction: 1
    lag: leading
    range: [0, 100]

  # ------------------------------------------------------------------- credit
  hicp_rents:
    label: Harmonised Consumer Price Index - actual rents
    plain: The harmonised index of consumer prices for actual rents on housing, set to 100 in a base year. Shows tenant-cost trend across the Eurozone.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: eurostat
    section: housing
    direction: 1
    lag: coincident
    range: [80, 130]
  hicp_maintenance:
    label: Harmonised Consumer Price Index - maintenance and repair
    plain: The harmonised index of consumer prices for housing maintenance and repair costs, set to 100 in a base year. Renovation spending moves before property transactions do.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: eurostat
    section: housing
    direction: 1
    lag: leading
    range: [80, 130]
  euribor_12m:
    label: Euribor 12-month
    plain: The interest rate most Spanish variable-rate mortgages are priced off. When this rises, monthly repayments follow.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: bde
    section: credit
    direction: -1
    lag: leading
    range: [-1.5, 20]
  ecb_mortgage_rate:
    label: ECB mortgage rate (Spain)
    plain: The interest rate banks are charging on new mortgages to households, sourced from the ECB's Monetary Interest Rates dataset.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: ecb
    section: credit
    direction: -1
    lag: leading
    range: [0, 20]
  mortgage_rate_new:
    label: New mortgage rate
    plain: The interest rate banks are charging on new mortgages.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: bde
    section: credit
    direction: -1
    lag: leading
    range: [0, 20]
  npl_ratio:
    label: Doubtful loan ratio
    plain: What share of bank loans are not being repaid. Rises late, after trouble has already happened.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: bde
    section: credit
    direction: -1
    lag: lagging
    range: [0, 25]

  # ------------------------------------------------------------------ distress
  foreclosures:
    label: Mortgage foreclosures filed
    plain: How many times a lender started court proceedings to take a home over unpaid mortgage debt.
    label_es: Ejecuciones hipotecarias
    unit: cases
    cadence: quarterly
    geo_level: province
    source_id: cgpj
    section: distress
    direction: -1
    lag: lagging
    range: [0, 20000]
  evictions:
    label: Evictions carried out
    plain: How many evictions courts actually carried out.
    label_es: Lanzamientos practicados
    unit: cases
    cadence: quarterly
    geo_level: province
    source_id: cgpj
    section: distress
    direction: -1
    lag: lagging
    range: [0, 20000]
    note: >
      Evictions actually carried out, which is the sum of the mortgage, rental-law
      and other categories CGPJ publishes. It moves separately from eviction orders
      received, because each court district works through its own enforcement
      backlog: in the first quarter of 2026, orders received rose sharply almost
      everywhere while executions fell in Zaragoza and the Balearics and rose in
      Madrid and Bizkaia. The most recent quarter is provisional and is usually
      revised upward, so treat it as incomplete rather than as a turning point.
  auctions_realestate:
    label: Judicial property auctions
    plain: How many properties were put up for judicial auction.
    unit: auctions
    cadence: monthly
    geo_level: province
    source_id: boe_subastas
    section: distress
    direction: -1
    lag: coincident
    range: [0, 5000]
  company_incorporations:
    label: Companies incorporated
    plain: How many new companies were registered.
    unit: companies
    cadence: monthly
    geo_level: province
    source_id: borme
    section: distress
    direction: 1
    lag: leading
    range: [0, 12000]
  company_dissolutions:
    label: Companies dissolved
    plain: How many companies were wound up.
    unit: companies
    cadence: monthly
    geo_level: province
    source_id: borme
    section: distress
    direction: -1
    lag: coincident
    range: [0, 8000]
  insolvencies:
    label: Insolvency proceedings
    plain: How many businesses formally went insolvent.
    unit: cases
    cadence: monthly
    geo_level: province
    source_id: borme
    section: distress
    direction: -1
    lag: lagging
    range: [0, 4000]

  # ----------------------------------------------------- attention (not demand)
  wiki_city_views:
    label: Wikipedia views, city article (all languages)
    plain: How many times people read this city's Wikipedia article.
    unit: views
    cadence: monthly
    geo_level: municipality
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range: [0, 20000000]
  wiki_city_foreign_share:
    label: Non-Spanish share of city article views
    plain: What share of the city's Wikipedia readers are reading in a language other than Spanish — a rough read on interest from abroad.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  wiki_city_attention:
    label: City attention share
    plain: How much of Wikipedia's traffic goes to this city, so years can be compared as reading habits change.
    unit: per_million
    cadence: monthly
    geo_level: municipality
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range: [0, 10000]
    note: >
      City article views per million views of the same language editions. Raw
      pageview counts fell about 45% between 2021 and 2026 as search behaviour
      changed, so only the share is comparable across years.
  wiki_hardship_index:
    label: Hardship attention (Euribor, eviction, benefits)
    plain: How often people look up Euribor, evictions, mortgages and unemployment benefits. Worry, not hardship itself.
    unit: per_million
    cadence: monthly
    geo_level: nation
    source_id: wikipedia
    section: attention
    direction: -1
    lag: leading
    range: [0, 10000]
  wiki_relocation_index:
    label: Relocation attention (padrón, NIE, visas)
    plain: How often people look up residency registration, visas and foreigner ID — the paperwork of moving to Spain.
    unit: per_million
    cadence: monthly
    geo_level: nation
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range: [0, 10000]
  wiki_barrio_views:
    label: Madrid neighbourhood Wikipedia views
    plain: How many times people read about a Madrid neighbourhood. Gentrification signals that lead rents, with attention to Malasaña, Lavapiés, Chueca and Salamanca indicating shifting desirability.
    unit: views
    cadence: monthly
    geo_level: district
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range: [0, 1000000]
    note: >
      District-level Wikipedia pageviews for Madrid neighbourhoods. Covers Malasaña,
      Lavapiés, Chueca (Centro, 01), Barrio de Salamanca (04), Chamberí (07),
      Carabanchel (11), Usera (12), and Tetuán (06). History back to 2018.
  search_rental_pressure:
    label: Rental search pressure
    plain: How hard people are searching for somewhere to rent here.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  search_buy_momentum:
    label: Buyer search momentum
    plain: How hard people are searching to buy here.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  search_relocation:
    label: Relocation search intent
    plain: How hard people are searching about moving here.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  search_room_share:
    label: Room-vs-flat search spread
    plain: How often people search for a room compared with a whole flat. Rising means households are compressing — taking a room because a flat is out of reach.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: -1
    lag: leading
    range: [0, 400]
  search_tenure_switch:
    label: Buy-vs-rent search spread
    plain: How often people search to buy compared with to rent. Rising means attention is shifting from renting toward buying.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 400]
  search_commercial_rent:
    label: Commercial premises search
    plain: How hard people are searching for a commercial unit to rent in Madrid — shops and bars looking for a home.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  search_eviction:
    label: Eviction search attention
    plain: How often people across Spain look up evictions. Worry and legal research, not evictions themselves.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: trends_manual
    section: attention
    direction: -1
    lag: leading
    range: [0, 100]
  search_barrio_attention:
    label: Neighbourhood search attention
    plain: How often people search for flats in this specific neighbourhood, rather than the city as a whole.
    unit: index
    cadence: monthly
    geo_level: district
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  search_hardship:
    label: Household hardship search
    plain: How hard people are searching for help with money — benefits, debt, eviction.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: trends_manual
    section: attention
    direction: -1
    lag: leading
    range: [0, 100]
  search_travel_intent:
    label: Inbound travel search intent
    plain: How hard people are searching about visiting.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  search_commercial_distress:
    label: Business-exit search (traspaso local)
    plain: How hard people are searching to hand over a business lease, which is how a struggling shop or bar exits.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: -1
    lag: leading
    range: [0, 100]

  news_volume:
    label: News coverage volume
    plain: How much news coverage the city is getting.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: gdelt
    section: attention
    direction: 1
    lag: leading
    range: [0, 100]
  news_tone:
    label: News coverage tone
    plain: Whether coverage of the city reads positive or negative.
    unit: tone
    cadence: monthly
    geo_level: municipality
    source_id: gdelt
    section: attention
    direction: 1
    lag: leading
    range: [-25, 25]
  news_housing_volume:
    label: Housing-themed coverage volume
    plain: How much of the city's coverage is about housing, rents and evictions.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: gdelt
    section: attention
    direction: -1
    lag: leading
    range: [0, 100]

  traffic_intensity:
    label: Traffic intensity
    plain: How many vehicles moved through the city, aggregated from thousands of sensors to a monthly mean.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: madrid_trafico
    section: work
    direction: 1
    lag: coincident
    range: [0, 10000]
    note: >
      Monthly mean of hourly vehicle counts across all traffic sensors. This is a live
      activity proxy: traffic volume tracks commuting and commercial movement in real time,
      and cannot be gamed like survey data. The 2020 COVID lockdown produces a clear 60-80%
      collapse in April-May.

  no2_level:
    label: Air quality NO2
    plain: Nitrogen dioxide concentration, an overwhelmingly traffic-generated pollution proxy and genuine liveability measure.
    unit: micrograms_m3
    cadence: monthly
    geo_level: municipality
    source_id: eea_air
    section: work
    direction: -1
    lag: coincident
    range: [0, 200]
    note: >
      Monthly mean of NO2 measurements from European Environment Agency monitoring stations.
      NO2 is traffic-generated and independent of other measures, making it a hard-to-game
      activity proxy. Shows clear 2020 COVID lockdown collapse and strong winter>summer
      seasonal pattern. Data sourced from EEA Air Quality Download Service (successor to
      the disabled madrid_aire adapter which was rate-limited).

  vehicle_registrations:
    label: New vehicle registrations
    plain: How many vehicles were newly registered — a fast, keyless read on household and business confidence.
    label_es: Matriculaciones de vehículos
    unit: vehicles
    cadence: monthly
    geo_level: province
    source_id: dgt
    section: work
    direction: 1
    lag: leading
    range: [0, 200000]
    note: >
      Not "new cars sold". Counts DGT transaction code 1 ("Matriculación
      ordinaria y de ciclomotores") only — genuine new registrations, never
      transfers of ownership, temporary plates, re-registrations or
      de-registrations, which are separate transaction codes and excluded.
      But that transaction code spans nearly every vehicle class, not cars
      alone: in a sampled month, passenger cars were about 69% of qualifying
      rows, motorcycles and mopeds about 14%, vans about 9%, and the
      remainder trucks, buses, trailers, agricultural machinery and a
      handful of historic and special vehicles. The province is where the
      registration was filed (DGT's own COD_PROVINCIA_MAT), not the vehicle
      owner's home province (COD_PROVINCIA_MAT and COD_PROVINCIA_VEH are
      different fields in the source file) — Madrid runs 3-4x above
      Barcelona because national fleet, leasing and rental-car operators
      file their registrations there administratively regardless of where
      the vehicle will actually operate. That is a real, widely-reported
      feature of Spanish registration statistics, not a data error: this
      adapter's province-level annual totals were cross-checked against
      DGT's own published "Matriculación por provincias" table and matched
      to within the one month DGT itself never published.
  job_postings_index:
    label: Job postings index
    plain: Index level of total job postings on Indeed for Spain (100 = February 2020), seasonally adjusted and 7-day lagged. A forward-looking indicator of hiring intent.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: indeed
    section: work
    direction: 1
    lag: leading
    range: [0, 200]
    note: >
      Indeed publishes daily observations for both 'total postings' and 'new postings';
      we use 'total postings'. The index is seasonally adjusted. February 2020 baseline = 100.
      Recent months are withheld until Indeed's data is complete (before the month ends).

