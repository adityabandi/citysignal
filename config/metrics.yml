  wiki_foreign_interest:
    label: Foreign interest ratio
    plain: Non-Spanish-language Wikipedia views about this city, divided by Spanish-language
      views — a rising ratio means the world is paying more attention than Spain itself.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: wiki_langs
    section: attention
