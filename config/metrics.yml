  wiki_foreign_interest:
    label: Foreign interest ratio
    plain: Non-Spanish-language Wikipedia views about this city, divided by Spanish-language views — a rising ratio means the world is paying more attention than Spain itself.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: wiki_langs
    section: attention
    direction: 1
    lag: leading
    range: [0, 1000]
    note: >
      Computed as (sum of non-Spanish language edition views) ÷ (Spanish Wikipedia views) × 100.
      A rising ratio signals rising foreign interest; the absolute value is harder to interpret
      because it depends on platform-wide usage patterns. Used to track whether a city's interest
      is shifting toward or away from foreign origin markets (relocation, tourism, investment).

  # --------- Wikipedia article-to-article navigation (revealed intent)
  wiki_intent_clicks:
    label: Clicks to relocation and housing articles
    plain: How many times readers clicked from this city's Wikipedia article to articles about cost of living, housing, visas, or relocation to Spain.
    unit: clicks
    cadence: monthly
    geo_level: municipality
    source_id: wiki_clickstream
    section: attention
    direction: 1
    lag: leading
    range: [0, 100000]
    note: >
      Extracted from Wikimedia's aggregated clickstream dumps (monthly, 12 months trailing).
      Counts clicks FROM city articles TO housing/relocation intent articles (cost of living,
      real estate, visas, immigration, etc.). Reveals intent more directly than pageviews alone.
      Published only when dumps are available and parseable. Metric is optional; not all months
      may have data if the source is disabled or dumps are unavailable.

