metrics:
  population_padron:
    label: Population (padrón)
    plain: How many people are officially registered as living in the city.
    label_es: Población (padrón)
    unit: persons
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: lagging
    range:
    - 1000
    - 4000000
  population_foreign_share:
    label: Foreign-national share
    plain: What share of registered residents hold a foreign nationality.
    unit: percent
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: lagging
    range:
    - 0
    - 80
  net_migration:
    label: Net migration
    plain: People moving in minus people moving out.
    unit: persons
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: coincident
    range:
    - -200000
    - 200000
  births:
    label: Births
    plain: How many babies were born to mothers living here. Housing demand two decades
      ahead, and household formation now.
    unit: births
    cadence: monthly
    geo_level: province
    source_id: ine
    section: people
    direction: 1
    lag: leading
    range:
    - 0
    - 20000
  marriages:
    label: Marriages
    plain: How many couples were married. Signals household formation and demand for
      homes together.
    unit: marriages
    cadence: monthly
    geo_level: province
    source_id: ine
    section: people
    direction: 1
    lag: leading
    range:
    - 0
    - 10000
  rent_reference:
    label: Reference rent
    plain: What a square metre of rented housing costs per month, from the government's
      rent index.
    label_es: Precio de referencia del alquiler
    unit: eur_m2_month
    cadence: annual
    geo_level: municipality
    source_id: mivau
    section: housing
    direction: 1
    lag: coincident
    range:
    - 1
    - 60
  dwelling_stock:
    label: Dwelling stock
    plain: How many homes exist in total.
    unit: dwellings
    cadence: annual
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: lagging
    range:
    - 500
    - 4000000
    note: 'Published by province only — there is no municipal breakdown in the ministry''s
      estimate. Madrid province holds about 3.05 million dwellings against roughly
      1.5 million in the municipality, so this is provincial context rather than a
      count of homes in the city. Per-dwelling ratios built on it inherit that scope
      and are labelled accordingly.

      '
  housing_transactions:
    label: Housing transactions
    plain: How many homes changed hands.
    unit: transactions
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: housing
    direction: 1
    lag: leading
    range:
    - 0
    - 60000
    note: 'Not currently collected. The ministry''s transactions file only carries
      counts for one subsidised-housing category, which would misrepresent total market
      volume if published as "housing transactions". INE''s registered property transfers
      cover the same ground honestly and are used instead. The metric stays declared
      so the gap is visible rather than forgotten.

      '
  appraised_value:
    label: Appraised housing value
    plain: What valuers say a square metre of housing is worth — the number banks
      lend against.
    unit: eur_m2
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: housing
    direction: 1
    lag: lagging
    range:
    - 200
    - 8000
  land_price:
    label: Urban land price
    plain: What building land costs per square metre. It moves before construction
      does.
    unit: eur_m2
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: leading
    range:
    - 10
    - 5000
  housing_starts:
    label: Housing starts
    plain: How many homes builders began. The earliest signal that supply is coming.
    unit: dwellings
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: leading
    range:
    - 0
    - 60000
  housing_completions:
    label: Housing completions
    plain: How many homes were finished and can actually be lived in.
    unit: dwellings
    cadence: quarterly
    geo_level: province
    source_id: mivau
    section: supply
    direction: 1
    lag: lagging
    range:
    - 0
    - 60000
  rent_district_m2:
    label: District rental price per square metre
    plain: What a square metre of rented housing costs per month, by district.
    unit: eur_m2_month
    cadence: annual
    geo_level: district
    source_id: serpavi
    section: housing
    direction: 1
    lag: coincident
    range:
    - 1
    - 60
  rent_district_total:
    label: District total monthly rent
    plain: The average total monthly rent for a full dwelling, by district.
    unit: eur
    cadence: annual
    geo_level: district
    source_id: serpavi
    section: housing
    direction: 1
    lag: coincident
    range:
    - 100
    - 6000
  rent_district_dwellings:
    label: Rented dwellings observed
    plain: How many rented dwellings were surveyed to build the district average rent.
    unit: dwellings
    cadence: annual
    geo_level: district
    source_id: serpavi
    section: housing
    direction: 1
    lag: coincident
    range:
    - 0
    - 200000
  house_price_index:
    label: House price index
    plain: The official measure of how house prices are moving, set to 100 in a base
      year.
    unit: index
    cadence: quarterly
    geo_level: ccaa
    source_id: ine
    section: housing
    direction: 1
    lag: lagging
    range:
    - 30
    - 400
  property_transfers:
    label: Property transfers (registered)
    plain: How many properties were legally transferred, from the land registry. Faster
      than the price statistics.
    unit: transactions
    cadence: monthly
    geo_level: province
    source_id: ine
    section: housing
    direction: 1
    lag: leading
    range:
    - 0
    - 40000
  mortgages_count:
    label: New mortgages on dwellings
    plain: How many new mortgages were signed on homes.
    unit: mortgages
    cadence: monthly
    geo_level: province
    source_id: ine
    section: credit
    direction: 1
    lag: leading
    range:
    - 0
    - 30000
  mortgage_amount_avg:
    label: Average mortgage amount
    plain: The average size of a new mortgage.
    unit: eur
    cadence: monthly
    geo_level: province
    source_id: ine
    section: credit
    direction: 1
    lag: coincident
    range:
    - 20000
    - 700000
  visados_new_build:
    label: Building permit visas (new construction buildings)
    plain: How many buildings received construction permits for new housing — the
      earliest signal of supply arriving.
    unit: buildings
    cadence: monthly
    geo_level: ccaa
    source_id: visados
    section: supply
    direction: 1
    lag: leading
    range:
    - 0
    - 2000
  visados_area:
    label: Building permits, construction area
    plain: The total area of new construction receiving permits, measured in square
      metres.
    unit: m2
    cadence: monthly
    geo_level: ccaa
    source_id: visados
    section: supply
    direction: 1
    lag: leading
    range:
    - 0
    - 5000000
  visados_budget:
    label: Building permits, execution budget
    plain: The estimated total budget for execution of newly permitted construction
      projects.
    unit: eur
    cadence: monthly
    geo_level: ccaa
    source_id: visados
    section: supply
    direction: 1
    lag: leading
    range:
    - 0
    - 3000000000
  notary_sales:
    label: Housing sales (notary records)
    plain: How many housing sales were signed before a notary — leading the land registry
      by about 2 months.
    unit: transactions
    cadence: monthly
    geo_level: province
    source_id: notariado
    section: housing
    direction: 1
    lag: leading
    range:
    - 0
    - 40000
  notary_price_m2:
    label: Housing price per square metre (notary records)
    plain: The price per square metre of housing sold, from notary records.
    unit: eur_m2
    cadence: monthly
    geo_level: province
    source_id: notariado
    section: housing
    direction: 1
    lag: leading
    range:
    - 200
    - 8000
  unemployment_registered:
    label: Registered unemployment
    plain: How many people are signed on as unemployed at the job office.
    label_es: Paro registrado
    unit: persons
    cadence: monthly
    geo_level: municipality
    source_id: sepe
    section: work
    direction: -1
    lag: coincident
    range:
    - 0
    - 600000
  contracts_registered:
    label: New contracts registered
    plain: How many new employment contracts were registered. Hiring shows up here
      first.
    unit: contracts
    cadence: monthly
    geo_level: municipality
    source_id: sepe
    section: work
    direction: 1
    lag: leading
    range:
    - 0
    - 400000
  affiliations:
    label: Social Security affiliations
    plain: How many people are paying into social security — the closest thing to
      a live headcount of who is working.
    unit: persons
    cadence: monthly
    geo_level: province
    source_id: segsocial
    section: work
    direction: 1
    lag: coincident
    range:
    - 1000
    - 4000000
  hotel_travellers:
    label: Hotel travellers
    plain: How many guests checked into hotels.
    unit: persons
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 2000000
  hotel_nights:
    label: Hotel overnight stays
    plain: How many nights guests actually stayed. Catches longer trips that guest
      counts miss.
    unit: nights
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 6000000
  hotel_international_share:
    label: International share of hotel nights
    plain: What share of hotel nights are booked by visitors from outside Spain.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 100
  hotel_occupancy_rate:
    label: Hotel occupancy rate
    plain: What share of hotel rooms were filled.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 100
  hotel_adr:
    label: Average daily rate
    plain: The average price paid for a hotel room per night.
    unit: eur
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 10
    - 600
  hotel_revpar:
    label: Revenue per available room
    plain: Room revenue per available room — price and occupancy combined, so it falls
      if either does.
    unit: eur
    cadence: monthly
    geo_level: municipality
    source_id: ine
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 500
  airport_passengers:
    label: Airport passengers
    plain: How many passengers passed through the city's airport.
    unit: passengers
    cadence: monthly
    geo_level: airport
    source_id: aena
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 8000000
  airport_flights:
    label: Airport flights (daily traffic)
    plain: How many flights the airport handled. Counted daily, so it arrives weeks
      before passenger figures.
    unit: flights
    cadence: monthly
    geo_level: airport
    source_id: eurocontrol
    section: tourism
    direction: 1
    lag: leading
    range:
    - 0
    - 60000
  port_passengers:
    label: Port passengers
    plain: How many passengers came through the port, including cruise arrivals.
    unit: passengers
    cadence: monthly
    geo_level: port
    source_id: puertos
    section: tourism
    direction: 1
    lag: coincident
    range:
    - 0
    - 1500000
  tourist_dwellings:
    label: Tourist dwellings (official)
    plain: How many homes are officially registered as tourist lets.
    unit: dwellings
    cadence: quarterly
    geo_level: municipality
    source_id: ine
    section: str
    direction: 1
    lag: coincident
    range:
    - 0
    - 100000
  tourist_dwelling_places:
    label: Tourist dwelling bed places
    plain: How many beds those registered tourist lets offer.
    unit: places
    cadence: quarterly
    geo_level: municipality
    source_id: ine
    section: str
    direction: 1
    lag: coincident
    range:
    - 0
    - 500000
  str_listings:
    label: Airbnb listings (research)
    plain: How many Airbnb listings are visible in the city. A scraped snapshot, not
      an official register.
    unit: listings
    cadence: monthly
    geo_level: municipality
    source_id: insideairbnb
    section: str
    direction: 1
    lag: leading
    range:
    - 0
    - 100000
  str_entire_home_share:
    label: Entire-home share of listings
    plain: What share of Airbnb listings are whole homes rather than a spare room
      — whole homes are the ones taken off the long-term market.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: insideairbnb
    section: str
    direction: 1
    lag: leading
    range:
    - 0
    - 100
  str_multi_host_share:
    label: Multi-listing host share
    plain: What share of listings belong to hosts running several. High means professional
      operators, not people letting a spare room.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: insideairbnb
    section: str
    direction: 1
    lag: leading
    range:
    - 0
    - 100
  hicp_rents:
    label: Harmonised Consumer Price Index - actual rents
    plain: The harmonised index of consumer prices for actual rents on housing, set
      to 100 in a base year. Shows tenant-cost trend across the Eurozone.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: eurostat
    section: housing
    direction: 1
    lag: coincident
    range:
    - 0
    - 1000
  hicp_maintenance:
    label: Harmonised Consumer Price Index - maintenance and repair
    plain: The harmonised index of consumer prices for housing maintenance and repair
      costs, set to 100 in a base year. Renovation spending moves before property
      transactions do.
    unit: index
    cadence: monthly
    geo_level: nation
    source_id: eurostat
    section: housing
    direction: 1
    lag: leading
    range:
    - 0
    - 1000
  euribor_12m:
    label: Euribor 12-month
    plain: The interest rate most Spanish variable-rate mortgages are priced off.
      When this rises, monthly repayments follow.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: bde
    section: credit
    direction: -1
    lag: leading
    range:
    - -1.5
    - 20
  eur_gbp:
    label: EUR/GBP
    plain: How many pounds a euro buys. When this rises a British buyer's budget on
      the Costa del Sol shrinks, before any housing statistic notices.
    unit: rate
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: 1
    lag: leading
    range:
    - 0.5
    - 1.2
  eur_usd:
    label: EUR/USD
    plain: How many dollars a euro buys. Sets what American and dollar-pegged buyers
      can afford here.
    unit: rate
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: 1
    lag: leading
    range:
    - 0.7
    - 1.8
  eur_jpy:
    label: EUR/JPY
    plain: How many yen a euro buys. The yen funds the world's carry trades, so a
      sharp fall here means those trades are unwinding and capital is leaving risky
      assets.
    unit: rate
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: 1
    lag: leading
    range:
    - 80
    - 220
  eur_sek:
    label: EUR/SEK
    plain: How many Swedish krona a euro buys. Swedish buyers concentrate on the Mediterranean
      coast.
    unit: rate
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: 1
    lag: leading
    range:
    - 7
    - 15
  eur_nok:
    label: EUR/NOK
    plain: How many Norwegian krone a euro buys. Norwegian buyers, same coast.
    unit: rate
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: 1
    lag: leading
    range:
    - 7
    - 15
  eur_chf:
    label: EUR/CHF
    plain: How many Swiss francs a euro buys.
    unit: rate
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: 1
    lag: leading
    range:
    - 0.7
    - 1.8
  ecb_policy_rate:
    label: ECB policy rate
    plain: The rate the European Central Bank charges banks. Everything Spanish borrowers
      pay is built on top of it.
    unit: percent
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: -1
    lag: leading
    range:
    - -1
    - 10
    note: 'Published by the ECB only when the rate actually changes, dated to the
      day. Forward-filled here to the rate in force in each month, which is the true
      statement and the only form that fits a monthly series.

      '
  euro_inflation:
    label: Euro-area inflation
    plain: How fast prices are rising across the euro area, which is what the central
      bank is actually reacting to.
    unit: percent
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: credit
    direction: -1
    lag: leading
    range:
    - -2
    - 15
  euro_unemployment:
    label: Euro-area unemployment
    plain: The share of euro-area workers without a job — the backdrop Spain's own
      labour market sits against.
    unit: percent
    cadence: monthly
    geo_level: euro_area
    source_id: ecb
    section: work
    direction: -1
    lag: coincident
    range:
    - 0
    - 30
  ecb_mortgage_rate:
    label: ECB mortgage rate (Spain)
    plain: The interest rate banks are charging on new mortgages to households, sourced
      from the ECB's Monetary Interest Rates dataset.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: ecb
    section: credit
    direction: -1
    lag: leading
    range:
    - 0
    - 20
  mortgage_rate_new:
    label: New mortgage rate
    plain: The interest rate banks are charging on new mortgages.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: bde
    section: credit
    direction: -1
    lag: leading
    range:
    - 0
    - 20
  npl_ratio:
    label: Doubtful loan ratio
    plain: What share of bank loans are not being repaid. Rises late, after trouble
      has already happened.
    unit: percent
    cadence: monthly
    geo_level: nation
    source_id: bde
    section: credit
    direction: -1
    lag: lagging
    range:
    - 0
    - 25
  foreclosures:
    label: Mortgage foreclosures filed
    plain: How many times a lender started court proceedings to take a home over unpaid
      mortgage debt.
    label_es: Ejecuciones hipotecarias
    unit: cases
    cadence: quarterly
    geo_level: province
    source_id: cgpj
    section: distress
    direction: -1
    lag: lagging
    range:
    - 0
    - 20000
  evictions:
    label: Evictions carried out
    plain: How many evictions courts actually carried out.
    label_es: Lanzamientos practicados
    unit: cases
    cadence: quarterly
    geo_level: province
    source_id: cgpj
    section: distress
    direction: -1
    lag: lagging
    range:
    - 0
    - 20000
    note: 'Evictions actually carried out, which is the sum of the mortgage, rental-law
      and other categories CGPJ publishes. It moves separately from eviction orders
      received, because each court district works through its own enforcement backlog:
      in the first quarter of 2026, orders received rose sharply almost everywhere
      while executions fell in Zaragoza and the Balearics and rose in Madrid and Bizkaia.
      The most recent quarter is provisional and is usually revised upward, so treat
      it as incomplete rather than as a turning point.

      '
  auctions_realestate:
    label: Judicial property auctions
    plain: How many properties were put up for judicial auction.
    unit: auctions
    cadence: monthly
    geo_level: province
    source_id: boe_subastas
    section: distress
    direction: -1
    lag: coincident
    range:
    - 0
    - 5000
  company_incorporations:
    label: Companies incorporated
    plain: How many new companies were registered.
    unit: companies
    cadence: monthly
    geo_level: province
    source_id: borme
    section: distress
    direction: 1
    lag: leading
    range:
    - 0
    - 12000
  company_dissolutions:
    label: Companies dissolved
    plain: How many companies were wound up.
    unit: companies
    cadence: monthly
    geo_level: province
    source_id: borme
    section: distress
    direction: -1
    lag: coincident
    range:
    - 0
    - 8000
  insolvencies:
    label: Insolvency proceedings
    plain: How many businesses formally went insolvent.
    unit: cases
    cadence: monthly
    geo_level: province
    source_id: borme
    section: distress
    direction: -1
    lag: lagging
    range:
    - 0
    - 4000
  wiki_city_views:
    label: Wikipedia views, city article (all languages)
    plain: How many times people read this city's Wikipedia article.
    unit: views
    cadence: monthly
    geo_level: municipality
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 20000000
  wiki_city_foreign_share:
    label: Non-Spanish share of city article views
    plain: What share of the city's Wikipedia readers are reading in a language other
      than Spanish — a rough read on interest from abroad.
    unit: percent
    cadence: monthly
    geo_level: municipality
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 100
  wiki_city_attention:
    label: City attention share
    plain: How much of Wikipedia's traffic goes to this city, so years can be compared
      as reading habits change.
    unit: per_million
    cadence: monthly
    geo_level: municipality
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 10000
    note: 'City article views per million views of the same language editions. Raw
      pageview counts fell about 45% between 2021 and 2026 as search behaviour changed,
      so only the share is comparable across years.

      '
  wiki_hardship_index:
    label: Hardship attention (Euribor, eviction, benefits)
    plain: How often people look up Euribor, evictions, mortgages and unemployment
      benefits. Worry, not hardship itself.
    unit: per_million
    cadence: monthly
    geo_level: nation
    source_id: wikipedia
    section: attention
    direction: -1
    lag: leading
    range:
    - 0
    - 10000
  wiki_relocation_index:
    label: Relocation attention (padrón, NIE, visas)
    plain: How often people look up residency registration, visas and foreigner ID
      — the paperwork of moving to Spain.
    unit: per_million
    cadence: monthly
    geo_level: nation
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 10000
  wiki_barrio_views:
    label: Madrid neighbourhood Wikipedia views
    plain: How many times people read about a Madrid neighbourhood. Gentrification
      signals that lead rents, with attention to Malasaña, Lavapiés, Chueca and Salamanca
      indicating shifting desirability.
    unit: views
    cadence: monthly
    geo_level: district
    source_id: wikipedia
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 1000000
    note: 'District-level Wikipedia pageviews for Madrid neighbourhoods. Covers Malasaña,
      Lavapiés, Chueca (Centro, 01), Barrio de Salamanca (04), Chamberí (07), Carabanchel
      (11), Usera (12), and Tetuán (06). History back to 2018.

      '
  search_rental_pressure:
    label: Rental search pressure
    plain: How hard people are searching for somewhere to rent here.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 100
  search_buy_momentum:
    label: Buyer search momentum
    plain: How hard people are searching to buy here.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
    direction: 1
    lag: leading
    range:
    - 0
    - 100
  search_relocation:
    label: Relocation search intent
    plain: How hard people are searching about moving here.
    unit: index
    cadence: monthly
    geo_level: municipality
    source_id: trends_manual
    section: attention
