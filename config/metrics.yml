    note: 'Indeed publishes daily observations for both ''total postings'' and ''new
      postings''; we use ''total postings''. The index is seasonally adjusted. February
      2020 baseline = 100. Recent months are withheld until Indeed''s data is complete
      (before the month ends).

      '
