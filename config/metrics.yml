# Metric registry. Every canonical record must name a metric_id defined here, and
# its unit and cadence must match. `direction` is +1 when a rising value means a
# hotter/stronger market and -1 when rising means weaker or more distressed —
# the derive engine uses it to orient z-scores before combining them.
# `lag` records whether the measure leads, coincides with, or lags the cycle;
# the lead-lag lab can demote a "leading" claim that stops holding.

metrics:
  # ---------------------------------------------------------------- population
  population_padron:
    label: Population (padrón)
    label_es: Población (padrón)
    unit: persons
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: lagging
    range: [1000, 4000000]
  population_foreign_share:
    label: Foreign-national share
    unit: percent
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: lagging
    range: [0, 80]
  net_migration:
    label: Net migration
    unit: persons
    cadence: annual
    geo_level: municipality
    source_id: ine
    section: people
    direction: 1
    lag: coincident
    range: [-200000, 200000]

