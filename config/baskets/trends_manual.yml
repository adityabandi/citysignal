# Google Trends baskets, exported by hand into data/manual/trends/.
#
# Trends rescales its 0-100 index per request, so numbers from two separate
# exports do not share a scale and must never be combined. Terms exported
# *together* do share one, which is the whole reason each basket is a single
# file with one column per term: it makes the ratios below legitimate.
#
# The ratios are the point. A level can fall because Spain searched less
# overall; a ratio between two terms measured on the same scale cannot.

version: trends-manual-v1
frozen_at: "2026-07-25"

# Google reports a term with too little volume as 0 rather than as missing. A
# series that is mostly zeros is not a quiet signal, it is an absent one, so a
# metric is dropped when fewer than this share of months carry a real value.
min_coverage: 0.7

baskets:
  housing:
    query: "alquiler piso {city} · alquiler habitacion {city} · comprar piso {city}"
    geo: ES
    columns: [rent_flat, rent_room, buy_flat]
    metrics:
      - metric: search_rental_pressure
        column: rent_flat
      - metric: search_buy_momentum
        column: buy_flat
      - metric: search_room_share
        ratio: [rent_room, rent_flat]
        scale: 100
      - metric: search_tenure_switch
        ratio: [buy_flat, rent_flat]
        scale: 100

  # Volume-matched baskets added 2026-07-26. The first attempt put `paro`
  # alongside `desahucio` and `impago hipoteca`; Trends scales a request to its
  # largest term, so the common word flattened the rare ones to literal zeros.
  # Terms in one basket must share a volume band or the basket destroys itself.
  commercial:
    query: "alquiler local madrid"
    geo: ES
    columns: [local_rent]
    metrics:
      - metric: search_commercial_rent
        column: local_rent

  distress:
    query: "desahucio (national — the city-qualified term has too little volume)"
    geo: ES
    columns: [eviction]
    metrics:
      - metric: search_eviction
        column: eviction

  relocation:
    query: "empadronamiento madrid · nie madrid"
    geo: ES
    columns: [padron_paperwork, nie]
    metrics:
      - metric: search_relocation
        column: padron_paperwork

  barrio:
    query: "pisos <barrio>"
    geo: ES
    columns: [attention]
    metrics:
      - metric: search_barrio_attention
        column: attention
