sources:
  ine:
    publisher: Instituto Nacional de Estadística
    license: INE reuse conditions (attribution)
    attribution: 'Source: INE (ine.es)'
    docs_url: https://ine.es/dyngs/DAB/index.htm?cid=1100
    kind: official
    cadence: monthly
    max_age_days: 120
    redistribute: true
  mivau:
    publisher: Ministerio de Vivienda y Agenda Urbana
    license: Reuse permitted (datos.gob.es, attribution)
    attribution: 'Source: MIVAU / datos.gob.es'
    docs_url: https://www.mivau.gob.es/vivienda/estadisticas
    kind: official
    cadence: quarterly
    max_age_days: 270
    redistribute: true
  sepe:
    publisher: Servicio Público de Empleo Estatal
    license: Reuse permitted (attribution)
    attribution: 'Source: SEPE'
    docs_url: https://www.sepe.es/HomeSepe/que-es-el-sepe/estadisticas/datos-estadisticos/municipios.html
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
  segsocial:
    publisher: Seguridad Social
    license: Reuse permitted (attribution)
    attribution: 'Source: Seguridad Social'
    docs_url: https://www.seg-social.es/wps/portal/wss/internet/EstadisticasPresupuestosEstudios
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
  bde:
    publisher: Banco de España
    license: Reuse permitted (attribution)
    attribution: 'Source: Banco de España'
    docs_url: https://www.bde.es/webbe/es/estadisticas/recursos/api-estadisticas-bde.html
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
  aena:
    publisher: Aena
    license: Reuse permitted (attribution)
    attribution: 'Source: Aena'
    docs_url: https://www.aena.es/es/estadisticas/inicio.html
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
  eurocontrol:
    publisher: EUROCONTROL
    license: EUROCONTROL open data terms (attribution, non-commercial research)
    attribution: 'Source: EUROCONTROL Aviation Intelligence Portal'
    docs_url: https://ansperformance.eu/data/
    kind: official
    cadence: daily
    max_age_days: 30
    redistribute: false
  puertos:
    publisher: Puertos del Estado
    license: Reuse permitted (attribution)
    attribution: 'Source: Puertos del Estado'
    docs_url: https://www.puertos.es/es-es/estadisticas
    kind: official
    cadence: monthly
    max_age_days: 120
    redistribute: true
  insideairbnb:
    publisher: Inside Airbnb
    license: CC BY 4.0 (independent research project)
    attribution: 'Source: Inside Airbnb (insideairbnb.com), a non-official research
      dataset'
    docs_url: https://insideairbnb.com/data-assumptions/
    kind: research
    cadence: quarterly
    max_age_days: 210
    redistribute: false
    notes: 'Scraped snapshots, not a register. Listings are not dwellings and not
      all listings are active. Always shown beside the official INE tourist-dwelling
      series rather than in place of it.

      '
  cgpj:
    publisher: Consejo General del Poder Judicial
    license: Reuse permitted (attribution)
    attribution: 'Source: CGPJ, Estadística Judicial'
    docs_url: https://www.poderjudicial.es/cgpj/es/Temas/Estadistica-Judicial/
    kind: official
    cadence: quarterly
    max_age_days: 210
    redistribute: true
  boe_subastas:
    publisher: Agencia Estatal Boletín Oficial del Estado
    license: Reuse permitted (attribution)
    attribution: 'Source: BOE, Portal de Subastas'
    docs_url: https://www.boe.es/datosabiertos/
    kind: official
    cadence: monthly
    max_age_days: 45
    redistribute: true
    enabled: false
    notes: 'Not collected. Judicial property auctions have no open-data API; the only
      route is the Portal de Subastas search, which is CAPTCHA-gated by IP — a fresh
      client is challenged on its first request. Working around bot detection is out
      of scope, so `auctions_realestate` stays unpopulated and the distress index
      runs without it rather than on invented numbers. The metric stays declared so
      the gap is visible instead of forgotten.

      '
  borme:
    publisher: Registro Mercantil / BOE
    license: Reuse permitted (attribution)
    attribution: 'Source: BORME (boe.es)'
    docs_url: https://www.boe.es/datosabiertos/documentos/APIsumarioBORME.pdf
    kind: official
    cadence: monthly
    max_age_days: 45
    redistribute: true
  wikipedia:
    publisher: Wikimedia Foundation
    license: CC0 (pageview data)
    attribution: 'Source: Wikimedia REST API pageviews'
    docs_url: https://wikimedia.org/api/rest_v1/
    kind: research
    cadence: monthly
    max_age_days: 45
    redistribute: true
    notes: 'Attention, not demand. Pageviews respond to news and seasonality as well
      as to intent; the lead-lag lab publishes whether each basket actually leads
      an observable outcome, and demotes it when it stops.

      '
  gdelt:
    enabled: false
    publisher: The GDELT Project
    license: Open, attribution requested
    attribution: 'Source: The GDELT Project (gdeltproject.org)'
    docs_url: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
    kind: research
    cadence: monthly
    max_age_days: 45
    redistribute: true
    notes: 'Collected but NOT published, pending verification. The adapter runs and
      returns plausible numbers, but coverage differs per metric without a stated
      reason — housing volume landed five cities, tone a different five, total volume
      six — which is the shape of intermittent fetch failures being absorbed rather
      than of a rule about what is measurable. Barcelona and Sevilla also swap rank
      mid-series, which is not obviously real. News attention is genuinely hard here:
      "Valencia" is also a city in Venezuela and "Malaga" one in Colombia, so a plausible-looking
      series of the wrong city is worse than no series. The history stays in the repository
      so the question can be settled; nothing reaches the site until it is.

      '
  dgt:
    publisher: Dirección General de Tráfico
    license: Reuse permitted (attribution)
    attribution: 'Source: DGT (dgt.es)'
    docs_url: https://www.dgt.es/menusecundario/dgt-en-cifras/
    kind: official
    cadence: monthly
    max_age_days: 90
    redistribute: true
    notes: 'Provincial vehicle-registration counts built from DGT''s monthly microdata
      export (one row per registration transaction nationwide), aggregated to province
      by this adapter since DGT''s own pre-aggregated tables are annual only. A clean,
      keyless consumer-confidence coincident indicator.

      '
  trends:
    publisher: Google
    license: Google Trends API terms (alpha)
    attribution: 'Source: Google Trends'
    docs_url: https://developers.google.com/search/apis/trends
    kind: commercial
    cadence: weekly
    max_age_days: 21
    redistribute: false
    enabled: false
    notes: 'Dormant. The API is alpha and application-gated as of July 2026; the adapter
      and its query baskets ship disabled and switch on when credentials exist.

      '
  trends_manual:
    publisher: Google Trends (manual export)
    license: Google Trends terms — exported by hand, not scraped
    attribution: 'Source: Google Trends, exported manually'
    docs_url: https://trends.google.com/trends/explore
    kind: commercial
    cadence: monthly
    max_age_days: 120
    redistribute: false
    notes: 'Reads hand-exported baskets from data/manual/trends/. This source reads
      hand-exported CSVs from data/manual/trends/; with none present it has nothing
      to do, and leaving it enabled would keep a failure issue open permanently for
      a state that is not a failure. Drop a file in that directory and set enabled:
      true. The unofficial Trends endpoints rate-limit on the first request, which
      makes them unfit for a scheduled build; a manual export is allowed, reproducible
      and never breaks the weekly run. Trends rescales 0-100 per request, so each
      file is its own series and is never compared across files.

      '
  madrid_padron:
    publisher: Ayuntamiento de Madrid
    license: Reuse permitted (attribution)
    attribution: 'Source: Ayuntamiento de Madrid, datos.madrid.es'
    docs_url: https://datos.madrid.es/portal/site/egob
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
  madrid_locales:
    publisher: Ayuntamiento de Madrid
    license: Reuse permitted (attribution)
    attribution: 'Source: Ayuntamiento de Madrid, Censo de Locales y Actividades'
    docs_url: https://datos.madrid.es/dataset/200085-0-censo-locales
    kind: official
    cadence: monthly
    max_age_days: 45
    redistribute: false
    notes: 'Published as a daily-refreshed current state with no history. CitySignal
      builds history itself as a hash-chained base snapshot plus monthly diffs, and
      commits only district-level aggregates.

      '
  madrid_vut:
    publisher: Ayuntamiento de Madrid
    license: Reuse permitted (attribution)
    attribution: 'Source: Ayuntamiento de Madrid, viviendas de uso turístico'
    docs_url: https://datos.madrid.es/dataset/300694-0-viviendas-turisticas-geoportal
    kind: official
    cadence: monthly
    max_age_days: 120
    redistribute: true
  serpavi:
    publisher: Ministerio de Vivienda y Agenda Urbana
    license: Reuse permitted (attribution)
    attribution: 'Source: MIVAU / SERPAVI'
    docs_url: https://www.mivau.gob.es/vivienda/alquila-bien-es-tu-derecho/serpavi
    kind: official
    cadence: annual
    max_age_days: 400
    redistribute: true
  madrid_licencias:
    publisher: Ayuntamiento de Madrid
    license: Reuse permitted (attribution)
    attribution: 'Source: Ayuntamiento de Madrid, datos.madrid.es'
    docs_url: https://datos.madrid.es/dataset/300193-0-licencias-urbanisticas
    kind: official
    cadence: monthly
    max_age_days: 45
    redistribute: true
  indeed:
    publisher: Indeed Hiring Lab
    license: Free for public use with attribution
    attribution: 'Source: Indeed Hiring Lab'
    docs_url: https://www.hiringlab.org/research/jobs-postings-tracker/
    kind: research
    cadence: monthly
    max_age_days: 14
    redistribute: true
  visados:
    publisher: Ministerio de Transportes y Movilidad Sostenible
    license: Reuse permitted (attribution)
    attribution: 'Source: Ministry of Transport, Building Permits Statistics'
    docs_url: https://www.transportes.gob.es/informacion-para-el-ciudadano/informacion-estadistica/vivienda-y-actuaciones-urbanas
    kind: official
    cadence: monthly
    max_age_days: 120
    redistribute: true
  madrid_trafico:
    enabled: false
    publisher: Ayuntamiento de Madrid
    license: Reuse permitted (attribution)
    attribution: 'Source: Ayuntamiento de Madrid, datos.madrid.es'
    docs_url: https://datos.madrid.es/portal/site/egob
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
    notes: 'Not collected. Adapter built for dataset 208627 (Tráfico. Histórico de
      datos del tráfico desde 2013) successfully discovered and fetched monthly ZIP
      files initially, producing 6 records (2026-01 through 2026-06) with mean traffic
      intensity values, verified valid. Adapter was updated to fetch 9 months (6 recent
      + 3 from 2020 for COVID sanity check), but CKAN API endpoint then returned HTTP
      403 Forbidden — rate-limiting kicked in, likely from exploratory API calls during
      development. Adapter code is production-ready (discover/parse/normalize correct);
      re-enable when rate-limit window expires or use a direct URL pattern if dataset
      layout is known. Endpoint: https://datos.madrid.es/api/3/action/package_show?id=208627-0-transporte-ptomedida-historico

      '
  madrid_aire:
    enabled: false
    publisher: Ayuntamiento de Madrid
    license: Reuse permitted (attribution)
    attribution: 'Source: Ayuntamiento de Madrid, datos.madrid.es'
    docs_url: https://datos.madrid.es/portal/site/egob
    kind: official
    cadence: monthly
    max_age_days: 75
    redistribute: true
    notes: 'Not collected. Adapter built for dataset 201410 (Calidad del aire. Datos
      diarios desde 2001, 76 CSV resources) but CKAN API returns HTTP 403 Forbidden
      after initial requests — rate-limiting. Adapter code verified correct (uses
      daily readings, MAGNITUD=8 for NO2, validity flags V-only). Data structure confirmed
      working (sample inspection shows winter 32.6% higher than summer: Jan 49.96,
      Jul 37.69 µg/m³). Re-enable when rate-limit resolves or dataset moved to different
      endpoint. Endpoint attempted: https://datos.madrid.es/api/3/action/package_show?id=201410-0-calidad-aire-diario

      '
  notariado:
    enabled: false
    publisher: Consejo General del Notariado
    license: Reuse permitted (attribution)
    attribution: 'Source: Consejo General del Notariado, CIEN'
    docs_url: https://www.notariado.org
    kind: official
    cadence: monthly
    max_age_days: 120
    redistribute: true
    notes: 'Not collected. The Consejo General del Notariado''s CIEN (Centro de Información
      Estadística del Notariado) statistics could not be located in machine-readable
      form. URLs attempted to fetch the data returned 404 even with a browser User-Agent.
      The source is withheld rather than guessed; metrics (notary_sales, notary_price_m2)
      stay declared so the gap is visible rather than forgotten.

      '
  ohsome:
    publisher: HeiGIT (Heidelberg Institute for Geoinformation Technology)
    license: ODbL 1.0 (OpenStreetMap data)
    attribution: 'Source: ohsome API (openstreetmap.org), HeiGIT'
    docs_url: https://ohsome.org/
    kind: research
    cadence: monthly
    max_age_days: 45
    redistribute: true
    notes: 'Commercial POI density via OpenStreetMap edit history. Raw counts are
      mapping-effort-contaminated before ~2019 (volunteer mapper pushes look like
      commercial growth); the ratio metric (osm_food_share) is the published signal.
      District-level, Madrid only. Monthly from 2019-01 onward.

      '
  wiki_langs:
    publisher: Wikimedia Foundation
    license: CC0 (pageview data)
    attribution: 'Source: Wikimedia REST API pageviews'
    docs_url: https://wikimedia.org/api/rest_v1/
    kind: research
    cadence: monthly
    max_age_days: 45
    redistribute: true
    notes: 'Language-split Wikipedia pageviews as an origin-market attention proxy.
      Published as per-million shares of total traffic per language edition, not raw
      counts. Covers 13 language editions (en, de, fr, it, pt, nl, pl, sv, da, ru,
      ja, zh, ar). Languages with < 500 views/month median are dropped. All articles
      verified to refer to Spanish cities (not homonyms). Eight Spanish cities.

      '
  wiki_clickstream:
    enabled: false
    publisher: Wikimedia Foundation
    license: CC0 (clickstream data)
    attribution: 'Source: Wikimedia Clickstream'
    docs_url: https://dumps.wikimedia.org/other/clickstream/
    kind: research
    cadence: monthly
    max_age_days: 60
    redistribute: false
    notes: 'DISABLED. Wikipedia article-to-article navigation (revealed intent). Adapter
      streams and filters monthly dumps (~100–500 MB gzipped each) without materializing
      raw files. Counts clicks FROM city articles TO housing/relocation intent articles.
      Large file sizes may require memory; enable only if needed. Fetch may fail if
      dump URLs change or storage is unavailable.

      '
  eurostat:
    publisher: Eurostat (European Commission)
    license: CC BY 4.0
    attribution: 'Source: Eurostat'
    docs_url: https://ec.europa.eu/eurostat/web/json-and-unicode-web-services/getting-started/rest-request
    kind: official
    cadence: monthly
    max_age_days: 60
    redistribute: true
  ecb:
    publisher: European Central Bank
    license: ECB copyright, data available under CC BY 4.0
    attribution: 'Source: ECB Data Portal'
    docs_url: https://www.ecb.europa.eu/stats/ecb_statistics/info/services/html/index.en.html
    kind: official
    cadence: monthly
    max_age_days: 60
    redistribute: true
  eea_air:
    publisher: European Environment Agency
    license: EEA Data and Maps Service Terms and Conditions
    attribution: 'Source: European Environment Agency Air Quality Download Service'
    docs_url: https://eeadmz1-downloads-webapp.azurewebsites.net/
    kind: official
    cadence: monthly
    max_age_days: 60
    redistribute: true
  eurostat_macro:
    source_id: eurostat_macro
    publisher: Eurostat / European Commission DG ECFIN
    license: Eurostat reuse policy (attribution)
    attribution: 'Source: Eurostat; ESI: DG ECFIN'
    docs_url: https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/api-introduction
    cadence: monthly
    geo_level: nation
    max_age_days: 100
    redistribute: true
    kind: official
    notes: GDP, jobs, prices, industry, retail, sentiment and housing for six European
      countries. Quarterly series use their own freshness limits in the country dashboard.
  worldbank:
    source_id: worldbank
    publisher: World Bank — World Development Indicators
    license: CC BY 4.0 (World Bank open data terms)
    attribution: 'Source: World Bank, World Development Indicators'
    docs_url: https://datahelpdesk.worldbank.org/knowledgebase/topics/125589
    cadence: annual
    geo_level: nation
    max_age_days: 900
    redistribute: true
    kind: official
    notes: Annual GDP growth, consumer inflation, modelled unemployment, population,
      PPP-adjusted real GDP per person and trade openness for 28 major markets. Historical
      benchmarks, excluded from the activity reading.
  ree:
    source_id: ree
    publisher: Red Eléctrica
    license: Red Eléctrica legal notice; commercial redistribution requires review
    attribution: 'Source: Red Eléctrica, REData'
    docs_url: https://www.ree.es/en/datos/apidata
    cadence: daily
    geo_level: nation
    max_age_days: 10
    redistribute: true
    kind: official
    notes: National daily electricity demand (MWh) and mainland corrected large-user
      electricity index (>450 kW). Electricity is a proxy, affected by weather, efficiency
      and sector mix.
  indeed_daily:
    source_id: indeed_daily
    publisher: Indeed Hiring Lab
    license: CC BY 4.0 (Hiring Lab repository); verify redistribution before commercial
      delivery
    attribution: 'Source: Indeed Hiring Lab'
    docs_url: https://github.com/hiring-lab/job_postings_tracker
    cadence: daily
    geo_level: nation
    max_age_days: 21
    redistribute: true
    kind: research
    notes: Daily seasonally adjusted total and new job posting indices. 1 February
      2020=100; publisher uses a seven-day moving average. Platform coverage is not
      the whole labour market.
  ember:
    source_id: ember
    publisher: Ember
    license: Ember data terms; CC BY 4.0
    attribution: 'Source: Ember, Monthly Electricity Data'
    docs_url: https://ember-energy.org/data/monthly-electricity-data/
    cadence: monthly
    geo_level: nation
    max_age_days: 150
    kind: research
    notes: National monthly electricity demand, fossil generation share, carbon intensity
      and available day-ahead prices. Source lags vary by country. Demand is not weather-adjusted;
      energy mix is exposure, not a growth forecast.
    redistribute: true
  portwatch:
    source_id: portwatch
    publisher: IMF PortWatch / UN Global Platform
    license: IMF terms of use; confirm applicable commercial redistribution rights
    attribution: 'Sources: UN Global Platform; IMF PortWatch (portwatch.imf.org).
      Country aggregates calculated by CitySignal.'
    docs_url: https://portwatch.imf.org/pages/data-and-methodology
    cadence: monthly
    geo_level: nation
    max_age_days: 100
    kind: research
    notes: Monthly AIS-estimated physical imports, exports and port calls. Covered
      ports only; includes transshipment. Not customs trade, dollar values, seasonally
      adjusted data or a GDP forecast.
    redistribute: false
  bis_macro:
    publisher: Bank for International Settlements
    license: BIS terms of use; attribution
    attribution: 'Source: BIS'
    docs_url: https://data.bis.org/bulkdownload
    kind: official
    cadence: monthly
    max_age_days: 100
    redistribute: true
  oecd_cli:
    publisher: OECD
    license: OECD terms of use; attribution
    attribution: 'Source: OECD, Composite Leading Indicators'
    docs_url: https://www.oecd.org/en/data/datasets/oecd-composite-leading-indicators-clis.html
    kind: official
    cadence: monthly
    max_age_days: 100
    redistribute: true
  gpr:
    publisher: Caldara & Iacoviello
    license: Creative Commons Attribution; credit authors
    attribution: 'Source: Dario Caldara and Matteo Iacoviello, Geopolitical Risk Index'
    docs_url: https://www.matteoiacoviello.com/gpr_country.htm
    kind: research
    cadence: monthly
    max_age_days: 75
    redistribute: true

  oecd_activity:
    source_id: oecd_activity
    publisher: OECD
    license: OECD terms of use; attribution
    attribution: 'Source: OECD, national accounts and short-term statistics'
    docs_url: https://data-explorer.oecd.org/
    cadence: monthly
    geo_level: nation
    max_age_days: 120
    redistribute: true
    kind: official
    notes: Seasonally adjusted real GDP, household consumption, investment, industry,
      retail volume and harmonised unemployment. GDP growth is quarter-on-quarter, not
      annualised.

  treasury_receipts:
    source_id: treasury_receipts
    publisher: US Treasury, Bureau of the Fiscal Service
    license: US government public data
    attribution: 'Source: US Treasury, Daily Treasury Statement'
    docs_url: https://fiscal.treasury.gov/accounting/daily-treasury-statement
    cadence: daily
    geo_level: nation
    max_age_days: 10
    redistribute: true
    kind: official
    notes: Nominal cash receipts of withheld individual income and FICA taxes. Treasury
      reporting days; tax rules, bonuses and payment calendars affect the series.

  destatis_freight:
    source_id: destatis_freight
    publisher: Destatis / Bundesbank / BALM
    license: Data licence Germany attribution 2.0
    attribution: 'Source: Destatis, Deutsche Bundesbank and BALM'
    docs_url: https://www.destatis.de/DE/Themen/Branchen-Unternehmen/Industrie-Verarbeitendes-Gewerbe/Tabellen/Lkw-Maut-Fahrleistungsindex-Daten.html
    cadence: daily
    geo_level: nation
    max_age_days: 21
    redistribute: true
    kind: official
    notes: Daily mileage of trucks with at least four axles on German motorways. Calendar
      and seasonally adjusted; 2021=100. Updated weekly.

  rbi_payments:
    source_id: rbi_payments
    publisher: Reserve Bank of India
    license: RBI website copyright and reuse terms; attribution
    attribution: 'Source: Reserve Bank of India, Payment System Indicators'
    docs_url: https://www.rbi.org.in/Scripts/PSIUserView.aspx
    cadence: monthly
    geo_level: nation
    max_age_days: 90
    redistribute: true
    kind: official
    notes: UPI includes transfers and merchant payments. Credit-card spending is nominal.
      NETC series covers bank-linked payments, not all FASTag transactions. Platform
      adoption and scope changes affect growth.

  uk_payments:
    source_id: uk_payments
    publisher: UK Department for Business and Trade
    license: Open Government Licence v3.0
    attribution: 'Source: UK Payment Practices Reporting; calculations by CitySignal'
    docs_url: https://www.gov.uk/check-when-businesses-pay-invoices
    cadence: monthly
    geo_level: nation
    max_age_days: 75
    redistribute: true
    kind: official
    notes: Month-end panel of large-company payment disclosures filed by that date.
      Latest report per company, report end and filing within 12 months. Company medians,
      not invoice-weighted estimates; reporting periods and panel membership vary.
